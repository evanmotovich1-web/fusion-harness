<script>
  function getUTMParams() {
    const stored = sessionStorage.getItem("utmParams");
    let utmParams = stored ? JSON.parse(stored) : {};

    // Only extract and store UTM params once (on first load)
    if (!stored) {
      const urlParams = new URLSearchParams(window.location.search);

      // Standard UTM parameters
      ["utm_source", "utm_medium", "utm_campaign", "utm_term", "utm_content"].forEach((param) => {
        if (urlParams.has(param)) {
          utmParams[param] = urlParams.get(param);
        }
      });

      // Google Ads-specific parameters
      ["gclid", "gbraid", "wbraid", "gad_source", "gad_campaignid"].forEach((param) => {
        if (urlParams.has(param)) {
          utmParams[param] = urlParams.get(param);
        }
      });
    }
    // 🔄 Always update `utm_referrer`
    const referrer =
      document.referrer && document.referrer !== ""
        ? document.referrer
        : window.location.href;

    utmParams["utm_referrer"] = referrer;

    // ✅ Save updated object back to sessionStorage
    sessionStorage.setItem("utmParams", JSON.stringify(utmParams));
  }

  function appendUTMToButton() {
    const storedParams = sessionStorage.getItem("utmParams");
    const baseURL = "https://www.platform.persana.ai/login";
    if (storedParams) {
      const utmParams = JSON.parse(storedParams);
      const buttons = document.querySelectorAll(
        '[data-framer-component-name="UtmParamsButton"]'
      );
      buttons.forEach((button) => {
        let newUrl = new URL(baseURL);
        Object.keys(utmParams).forEach((key) => {
          newUrl.searchParams.append(key, utmParams[key]);
        });
        button.href = newUrl.toString();
      });
    }
  }

  function appendUTMToCalendlyButton() {
    const storedParams = sessionStorage.getItem("utmParams");
    const baseURL = "https://calendly.com/d/2xg-4vb-t3c/persana-ai-onboarding";
    if (storedParams) {
      const utmParams = JSON.parse(storedParams);
      const buttons = document.querySelectorAll(
        '[data-framer-component-name="UtmParamsCalendlyButton"]'
      );
      buttons.forEach((button) => {
        let newUrl = new URL(baseURL);
        Object.keys(utmParams).forEach((key) => {
          newUrl.searchParams.append(key, utmParams[key]);
        });
        button.href = newUrl.toString();
      });
    }
  }

  function runUTMScript() {
    getUTMParams(); // ⬅️ Handles both initial set and referrer update
    appendUTMToButton();
    appendUTMToCalendlyButton();
  }

  window.addEventListener("DOMContentLoaded", () => {
    setTimeout(runUTMScript, 100);

    const observer = new MutationObserver(() => {
       runUTMScript();
    });

    observer.observe(document.body, { childList: true, subtree: true });

    if (window.framer && window.framer.events) {
      window.framer.events.addEventListener("navigation", () => {
        runUTMScript(); // ⬅️ This will update the referrer every time
      });
    }
  });
</script>
