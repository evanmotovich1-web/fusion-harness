            {
              "@type": "Question",
              "name": "How do connectors work in Replit?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Connectors give the Replit Agent authenticated access to your external tools — so it can read and write data, not just generate code that talks to APIs in the abstract. Under the hood, connectors handle the OAuth or API-key flow and store credentials securely; once you connect a service, the Agent can use it live while building. The same connection also powers your deployed app: when your users log in through Stripe, pull their bank data via Plaid, or trigger a Slack message, they're going through the same connector infrastructure. Connectors are also exposed as MCP tools, meaning the Agent can discover and call them autonomously mid-session without you writing the integration code yourself."
              }
            },
            {
              "@type": "Question",
              "name": "Which connectors are available?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Replit supports 450+ connectors, including Stripe, Slack, Plaid, Figma, Notion, Google Workspace, Microsoft 365, Airtable, Shopify, Salesforce, Atlassian (Jira), Razorpay, and many more. New connectors ship regularly. You can browse the full list at replit.com/integrations."
              }
            },
            {
              "@type": "Question",
              "name": "How do I add a connector to my project?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Open the Integrations pane inside your Replit project and find the service you want to connect. For team-managed connectors (like Plaid or Stripe), an admin configures credentials once and individual users authenticate their own accounts. For personal connectors, you authenticate directly. Once connected, the Replit Agent automatically has access to those tools for the duration of your session — you don't need to wire anything up manually."
              }
            },
            {
              "@type": "Question",
              "name": "Can I connect a tool that isn't listed?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Replit supports the MCP (Model Context Protocol) standard, so any service that exposes an MCP server can be added directly. Go to replit.com/integrations, add a custom MCP endpoint, and the Agent will be able to discover and call its tools just like any first-party connector. Enterprise teams also use this path to connect internal systems and proprietary APIs."
              }
            },
            {
              "@type": "Question",
              "name": "Do connectors use my Replit credits?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Connecting to your tools is free — no credits are consumed by authentication or data reads. Credits are only used when the Agent generates or modifies code. One exception worth knowing: with the Stripe connector, you can actually earn Replit credits when you monetize your app. Builders receive $50 in credits for every $250 earned through Stripe, scaling up to $2,000 in credits for $100,000 in earnings. Credit rewards for additional payment connectors are coming soon."
              }
            }
          ]
