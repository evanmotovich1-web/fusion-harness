document.addEventListener("DOMContentLoaded", function () {

  document.querySelectorAll(".ta-loop").forEach(function (root) {
    var viewport = root.querySelector(".ta-loop__viewport");
    var track = root.querySelector(".ta-loop__track");
    if (!viewport || !track) return;

    var speed = parseFloat(root.dataset.speed) || 1.2;

    var originals = Array.from(track.children);
    originals.forEach(function (el) {
      track.appendChild(el.cloneNode(true));
    });

    var x = 0;
    var paused = false;

    function halfWidth() {
      return track.scrollWidth / 2;
    }

    function render() {
      track.style.transform = "translate3d(" + (-x) + "px,0,0)";
    }

    function tick() {
      if (!paused) {
        x += speed;
        var half = halfWidth();
        if (half > 0 && x >= half) x -= half;
        render();
      }
      requestAnimationFrame(tick);
    }

    viewport.addEventListener("mouseenter", function () { paused = true; });
    viewport.addEventListener("mouseleave", function () { paused = false; });

    var dragging = false;
    var startX = 0;
    var startOffset = 0;

    viewport.addEventListener("mousedown", function (e) {
      dragging = true;
      paused = true;
      startX = e.clientX;
      startOffset = x;
    });

    window.addEventListener("mouseup", function () {
      dragging = false;
      paused = false;
    });

    window.addEventListener("mousemove", function (e) {
      if (!dragging) return;
      x = startOffset - (e.clientX - startX);
      var half = halfWidth();
      while (x < 0) x += half;
      while (x >= half) x -= half;
      render();
    });

    viewport.addEventListener("touchstart", function (e) {
      dragging = true;
      paused = true;
      startX = e.touches[0].clientX;
      startOffset = x;
    }, { passive: true });

    viewport.addEventListener("touchmove", function (e) {
      if (!dragging) return;
      x = startOffset - (e.touches[0].clientX - startX);
      var half = halfWidth();
      while (x < 0) x += half;
      while (x >= half) x -= half;
      render();
    }, { passive: true });

    viewport.addEventListener("touchend", function () {
      dragging = false;
      paused = false;
    });

    track.addEventListener("click", function (e) {
      var media = e.target.closest(".ta-rect__media");
      if (!media) return;
      track.querySelectorAll(".ta-rect__media.is-active").forEach(function (el) {
        if (el !== media) el.classList.remove("is-active");
      });
      media.classList.toggle("is-active");
    });

    tick();
  });

});
