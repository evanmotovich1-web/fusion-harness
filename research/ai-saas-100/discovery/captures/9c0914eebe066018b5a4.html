<script type="80a3ba786ed5bb1cd982bd36-text/javascript">
(() => {
  "use strict";
  if (
    location.pathname.includes("/share-ask-ai") ||
    location.pathname.includes("/embed") ||
    location.pathname.includes("/share") ||
    new URLSearchParams(window.location.search).has("agency_id")
  ) return;

  if (window.WebsiteJourney) return;

  const KEY = "website_journey";
  const VISIT_GAP_MS = 30 * 60 * 1000;
  let lastPath = location.pathname;
  const PARAMS = [
    "utm_source", "utm_medium", "utm_campaign", "utm_term", "utm_content",
    "utm_id", "gclid", "fbclid", "msclkid", "ref", "referral"
  ];

  function read() {
    const raw = localStorage.getItem(KEY);
    if (raw === null) return null;
    const data = JSON.parse(raw);
    if (data?.version !== 1 || !data.first_landing || !Array.isArray(data.visits)) {
      throw new Error("Unsupported journey data");
    }
    return data;
  }

  function firstLanding(page) {
    const query = new URLSearchParams(location.search);
    const params = Object.fromEntries(
      PARAMS.filter(key => query.has(key)).map(key => [key, query.get(key)])
    );
    let referrer = null;
    if (document.referrer) {
      try {
        const url = new URL(document.referrer);
        referrer = url.origin + url.pathname;
      } catch { /* Keep an unavailable referrer as null. */ }
    }
    return { ...page, referrer, params };
  }

  function track() {
    lastPath = location.pathname;
    try {
      const now = Date.now();
      const page = { path: location.pathname, at: new Date(now).toISOString() };
      const data = read() || {
        version: 1,
        first_landing: firstLanding(page),
        visits: []
      };
      let visit = data.visits[data.visits.length - 1];
      if (visit && (!Number.isInteger(visit.id) || !Array.isArray(visit.pages))) {
        throw new Error("Invalid visit data");
      }
      const previous = visit?.pages[visit.pages.length - 1];
      const previousTime = previous ? Date.parse(previous.at) : NaN;
      if (visit && !Number.isFinite(previousTime)) {
        throw new Error("Invalid page timestamp");
      }
      if (!visit || now - previousTime >= VISIT_GAP_MS || now < previousTime) {
        visit = { id: visit ? visit.id + 1 : 1, pages: [] };
        data.visits.push(visit);
      }
      visit.pages.push(page);
      localStorage.setItem(KEY, JSON.stringify(data));
      return true;
    } catch {
      // Preserve existing storage if it is invalid, blocked, or full.
      console.warn("Website journey: this page view could not be saved.");
      return false;
    }
  }

  window.WebsiteJourney = {
    track,
    getJSON() {
      try {
        const data = read();
        return data ? JSON.stringify(data) : null;
      } catch {
        return null;
      }
    }
  };

  // Record the initial page before another script changes its URL parameters.
  track();

  // Record navigation that changes the path without a full page load.
  for (const method of ["pushState", "replaceState"]) {
    const original = history[method];
    history[method] = function (...args) {
      const oldPath = location.pathname;
      const result = original.apply(this, args);
      if (location.pathname !== oldPath) track();
      return result;
    };
  }
  window.addEventListener("popstate", () => {
    if (location.pathname !== lastPath) track();
    lastPath = location.pathname;
  });
  window.addEventListener("pageshow", event => {
    if (event.persisted) track();
    lastPath = location.pathname;
  });
})();
</script>

<script type="80a3ba786ed5bb1cd982bd36-text/javascript">
document.addEventListener('scroll', function () {
  try {
    const bubbles = document.querySelectorAll('#chat_bubble');
    if (!bubbles || bubbles.length === 0) return; // nothing to do

    const parallaxStrength = 0.12; // subtle, reversible movement
    const windowHeight = window.innerHeight || 0;
    if (!windowHeight) return;

    bubbles.forEach(bubble => {
      if (!(bubble instanceof HTMLElement)) return;

      const rect = bubble.getBoundingClientRect?.();
      if (!rect || !rect.height) return;

      const elementCenter = rect.top + rect.height / 2;
      const distanceFromCenter = elementCenter - windowHeight / 2;
      const offset = -distanceFromCenter * parallaxStrength;

      bubble.style.transform = `translateY(${offset}px)`;
    });
  } catch (err) {
    // Fail silently — avoids breaking other scroll handlers
  }
});
</script>
