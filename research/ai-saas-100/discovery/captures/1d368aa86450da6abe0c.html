    {
      "@context": "https://schema.org",

          "name": "What is GoldMine AI?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "GoldMine AI is an autonomous AI marketing platform built for solopreneurs and small teams. It gives you an Online Marketing Agent — covering content, SEO, cold outreach, backlinks, newsletter sponsorships, and more — that works from a shared understanding of your business called your Cortex. You steer with plain-language direction, the agent does the work, and you approve before anything ships."
          }
        },
        {
          "@type": "Question",
          "name": "What can GoldMine AI's marketing agent do?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Your Online Marketing Agent handles a growing set of marketing jobs from one place: it writes and publishes blog posts and social content, researches keywords and optimizes your site for search (SEO), identifies leads and drafts personalized cold outreach, builds domain authority through targeted backlink campaigns, and books newsletter sponsorships in front of audiences who already read about your space — with more capabilities added over time. Everything it does draws on your Cortex, so the work stays consistent with your brand, ICP, and positioning."
          }
        },
        {
          "@type": "Question",
          "name": "What is the Cortex?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Cortex is GoldMine AI's living memory of your business. It stores your ICP (ideal customer profile), brand voice, positioning, competitor landscape, and site content — and gets updated continuously as agents learn more. Every agent reads from the Cortex before acting, so the content, outreach, and SEO work they produce is always on-brand and strategically coherent."
          }
        },
        {
          "@type": "Question",
          "name": "How does GoldMine AI work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You add your business and GoldMine AI builds your Cortex automatically — analysing your site, ICP, brand voice, and market. From there, you give direction in plain language (via chat, Telegram, or Slack) and the agents produce work: articles, outreach sequences, keyword plans, backlink targets. Nothing is published without your approval. The whole team runs on autopilot, reporting back to you when work is ready to review."
          }
        },
        {
          "@type": "Question",
          "name": "How is GoldMine AI different from other marketing tools?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most marketing tools automate one task in isolation. GoldMine AI gives you a single agent that works across all of them with shared context — so your blog content, outreach emails, and SEO strategy all tell the same story. There are no disconnected dashboards to juggle; everything runs through the Cortex and surfaces results to you in one place. For solopreneurs and small teams, it replaces a marketing hire without the cost or coordination overhead."
          }
        },
        {
          "@type": "Question",
          "name": "Is GoldMine AI free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can start free — every account gets a 7-day free trial with full access to your Online Marketing Agent, your Cortex, and Telegram and Slack steering, and no credit card is needed to start. After the trial it is $29/month at our launch price (the regular price is $99/month), and you can cancel any time before day 7 without being charged."
          }
        }
