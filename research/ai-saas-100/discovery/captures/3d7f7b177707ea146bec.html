    <!-- Snippet: dwyCrcEvm --><script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Does Decktopus AI have a free plan?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Decktopus AI doesn't offer a free plan, but new users get free credits at signup to create a 3 slide presentation and try the platform first."
      }
    },
    {
      "@type": "Question",
      "name": "Can I export my presentation to PowerPoint, PDF, or PNG?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Decktopus AI supports export to PDF, PPT, and PNG, each available in standard or compressed quality."
      }
    },
    {
      "@type": "Question",
      "name": "Does Decktopus AI use my brand colors, fonts, and logo automatically?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Enter your website URL during creation and Decktopus AI automatically pulls your brand colors, fonts, and logo into the presentation."
      }
    },
    {
      "@type": "Question",
      "name": "Can I edit AI generated slides after they're created?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Use Edit with AI to make changes with a prompt, or Edit Text to edit slide content directly."
      }
    },
    {
      "@type": "Question",
      "name": "Does Decktopus AI work for any topic or industry?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Decktopus AI generates presentations for any topic or industry. Describe what you need and the AI builds the presentation."
      }
    },
    {
      "@type": "Question",
      "name": "Can I upload my own files to build a presentation from?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Upload a file and use it as a resource for a new presentation, or redesign it while keeping your existing content."
      }
    },
    {
      "@type": "Question",
      "name": "Is my presentation data private and secure with Decktopus AI?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Data is encrypted in transit with TLS 1.3 and at rest with AES-256, hosted on AWS infrastructure. Personal workspaces are accessible only to you, and shared workspaces are limited to authorized members. Decktopus AI does not use customer data for AI training. SOC 2 Type II compliance is currently in progress."
      }
    },
    {
      "@type": "Question",
      "name": "What if I don't like my first AI generated presentation?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Every slide can be edited after generation with Edit with AI or Edit Text. You can also restore a previous version from Version History or regenerate with a new prompt."
      }
    },
    {
      "@type": "Question",
      "name": "What languages does Decktopus AI support?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Decktopus AI supports English, French, German, Portuguese, Spanish, Turkish, and Arabic."
      }
    },
    {
      "@type": "Question",
      "name": "Can my team share templates and branding on Decktopus AI?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Team templates aren't available yet, but you can duplicate any presentation and share it across your organization. Branding imported from a URL is saved automatically and reused on future presentations."
      }
    },
    {
      "@type": "Question",
      "name": "Is there a limit on how many presentations I can create?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Your credit balance determines how many presentations you can create. Each slide costs 5 credits, and you can top up anytime with no subscription required."
      }
    },
    {
      "@type": "Question",
      "name": "Can I use Decktopus AI for client-facing presentations?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Share your presentation via link, export it as PDF, PPT, or PNG, or present directly from Decktopus AI, all with professional design built in."
      }
    }
  ]
}
